/* Compact mobile layout — Build 07 */

/* Build 08 */
:root{color-scheme:light;--bg:#eef3f6;--panel:#fff;--ink:#172c39;--muted:#526879;--border:#dce5eb;--control:#fff;--accent:#155e75;--future:#e2e8f0;--passed:#edf0f2;--current:#dbeafe;--current-ink:#1d4ed8;--past-ink:#64748b;--green:#087f5b;--amber:#92400e;--transfer:#fef3c7;--error:#a12424}

body{background:var(--bg);color:var(--ink)}
section,article{background:var(--panel);border-color:var(--border)}
button,input,select{background:var(--control);color:var(--ink);border-color:var(--border)}

.routeFlag{font-size:11px;color:var(--accent);margin:3px 0}.routePath{font-weight:600}.transferCard .routeFlag,.transferTag{color:var(--amber)}
.timelineRows{position:relative;padding:0 66px 0 0;isolation:isolate}
.timelineRows:before{position:absolute;content:"";left:6px;top:22px;bottom:22px;border-left:1px solid var(--border)}
.timelineRows .stoprow{height:44px;min-height:44px;display:grid;grid-template-columns:13px minmax(0,1fr);gap:5px;align-items:center}
.timelineRows .stopname{background:var(--future);color:var(--ink);text-align:left;padding:5px 7px;max-height:40px;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;transition:background-color .35s,color .35s;line-height:1.2;border:1px solid transparent}
.timelineRows .stopname:after{display:none}
.timelineRows .stopname.passed{background:var(--passed);color:var(--past-ink)}
.timelineRows .stopname.current{background:var(--current);color:var(--current-ink);border-color:#60a5fa;font-weight:700}
.timelineRows .stopname.board{background:#087f5b;color:#fff;font-weight:700}
.timelineRows .stopname.exit{background:#155e75;color:#fff;font-weight:700}
.timelineRows .stopname.transfer{background:var(--transfer);color:var(--amber);font-weight:700}
.stopDot{width:7px;height:7px;border-radius:50%;background:#94a3b8;justify-self:center;z-index:1}
[data-state=current] .stopDot{background:#3b82f6}[data-state=board] .stopDot{background:#22c55e;width:10px;height:10px}[data-state=exit] .stopDot{background:#0891b2}[data-state=transfer] .stopDot{background:#d97706}
.road,.markers{position:absolute;right:0;top:0;bottom:0;width:60px;border-radius:8px}
.road{background:#424b54;border:5px solid #424b54;box-shadow:inset 1px 0 #aab7c2,inset -1px 0 #aab7c2}
.road:before{content:"";position:absolute;left:50%;top:3px;bottom:3px;border-left:1px dashed #e2e8f0}
.markers{pointer-events:none;overflow:visible}.vehicleMarker{position:absolute;top:0;left:50%;width:42px;height:36px;transition:transform 1s ease-in-out;will-change:transform}
.vehicleMarker.noMotion{transition:none}.vehicleIcon{display:block;width:100%;height:100%;filter:drop-shadow(0 2px 2px #0007)}
.routeToggle{display:block;width:100%;font-size:12px;margin-top:7px;min-height:32px;color:var(--accent)}
.settingsGroup{border-top:1px solid var(--border);margin-top:8px;padding:4px 0}.settingsGroup>summary{font-size:14px}
#themeMode{width:auto;min-height:34px;margin:0;font-size:12px;padding:4px}
.themeRow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.legEta{font-weight:700;font-size:14px;display:block;margin-bottom:5px}

nav{gap:4px}nav button{padding:8px 2px;font-size:13px}
#otherPanel label{margin:8px 0 2px}#otherPanel #swapOther{font-size:12px;margin:3px 0 5px}
#otherPanel #findOther{width:100%;margin-top:5px}
#otherPanel .results button{margin-bottom:3px}
